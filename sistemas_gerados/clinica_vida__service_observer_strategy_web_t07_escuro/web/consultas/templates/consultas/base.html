{% load static %}<!doctype html>
<html lang="pt-br" data-bs-theme="dark" data-raio="arredondado" data-sombra="difusa" data-movimento="discreto" data-tipografia="sans" data-acessivel="nao">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B6FA4">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{% static 'consultas/icone-192.png' %}">
  <link rel="stylesheet" href="{% static 'consultas/vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'consultas/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'consultas/css/tema.css' %}">
  <title>{% block title %}Clínica Vida{% endblock %}</title>
</head>
<body>
  <nav class="navbar navbar-expand navbar-sgs">
    <div class="container">
      <a class="navbar-brand" href="{% url 'consultas:lista' %}">Clínica Vida</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{% url 'consultas:lista' %}">Lista</a>
        <a class="nav-link" href="{% url 'consultas:criar' %}">Cadastrar</a>
        <a class="nav-link" href="{% url 'consultas:api' %}">API</a>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    <h1 class="h3 mb-1">{% block page_title %}Clínica Vida{% endblock %}</h1>
    {% block page_subtitle %}{% endblock %}

    {% block toolbar_actions %}{% endblock %}
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'consultas/vendor/bootstrap/bootstrap.bundle.min.js' %}" defer></script>
  <script src="{% static 'consultas/js/app.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
